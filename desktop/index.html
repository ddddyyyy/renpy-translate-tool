<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ren'Py Translate</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main>
    <header>
      <div><small>REN'PY TRANSLATE</small><h1>游戏文本助手</h1></div>
      <span id="status">正在启动监听…</span>
    </header>

    <section>
      <label for="game">游戏目录</label>
      <div class="row">
        <input id="game" placeholder="选择或粘贴 Ren'Py 游戏目录">
        <button id="pick-game" class="quiet">选择目录</button>
        <button id="install">安装 Hook</button>
        <button id="uninstall" class="quiet">卸载</button>
      </div>
      <output id="hook-result"></output>
    </section>

    <section class="dialogue">
      <div class="section-title"><span>当前文本</span><small id="speaker"></small></div>
      <p id="source">启动游戏后，对话会自动出现在这里。也可以选中其中的词语。</p>
    </section>

    <section>
      <label for="selected">待翻译文本</label>
      <textarea id="selected" rows="3"></textarea>
      <div class="settings">
        <select id="provider" aria-label="翻译服务">
          <option value="openai">OpenAI 兼容</option>
          <option value="deepl">DeepL</option>
          <option value="google">Google Cloud</option>
          <option value="baidu">百度翻译</option>
          <option value="youdao">有道翻译</option>
        </select>
        <input id="base-url" placeholder="API Base URL" value="https://api.openai.com/v1">
        <input id="model" placeholder="模型名称">
        <input id="target" value="zh-CN" aria-label="目标语言">
      </div>
      <div class="row credential">
        <input id="credential-id" autocomplete="off" spellcheck="false" placeholder="App ID / App Key">
        <input id="credential-secret" type="password" autocomplete="off" spellcheck="false" placeholder="API Key / App Secret（系统凭据库）">
        <button id="save-credentials" class="quiet">保存凭据</button>
        <button id="clear-credentials" class="quiet">清除</button>
      </div>
      <small id="credential-status">正在检查凭据…</small>
      <div class="display-settings">
        <label for="overlay-opacity">背景不透明度 <output id="overlay-opacity-value">95%</output></label>
        <input id="overlay-opacity" type="range" min="40" max="100" step="5" value="95">
      </div>
      <div class="row actions">
        <button id="translate">翻译</button>
        <button id="cancel-translation" class="quiet" hidden>取消</button>
        <button id="whole" class="quiet">使用整句</button>
      </div>
    </section>

    <section>
      <h2>应用设置</h2>
      <div class="settings app-settings">
        <input id="select-shortcut" value="CmdOrCtrl+Shift+Space" aria-label="选词快捷键">
        <input id="sentence-shortcut" value="CmdOrCtrl+Shift+Enter" aria-label="整句快捷键">
        <button id="save-shortcuts" class="quiet">保存快捷键</button>
      </div>
      <div class="row">
        <button id="check-update" class="quiet">检查更新</button>
        <output id="app-status"></output>
      </div>
    </section>

    <section>
      <div class="section-title"><label for="translation">翻译结果</label></div>
      <textarea id="translation" rows="4"></textarea>
      <div class="row">
        <input id="save-tags" placeholder="标签（逗号分隔）">
        <input id="save-group" placeholder="分组">
        <button id="save" class="quiet">保存到单词本</button>
      </div>
    </section>

    <section>
      <div class="section-title"><h2>单词本</h2><div class="row"><button id="import-saved" class="quiet">导入 CSV</button><button id="export-saved" class="quiet">导出 CSV</button></div></div>
      <div class="row">
        <input id="saved-search" placeholder="搜索原文、翻译、上下文或标签">
        <input id="saved-group" placeholder="筛选分组">
        <button id="start-review" class="quiet">开始复习</button>
      </div>
      <div id="review-card" class="review-card" hidden>
        <strong id="review-source"></strong>
        <button id="speak-review" class="quiet" aria-label="朗读原文">朗读</button>
        <p id="review-translation" hidden></p>
        <button id="reveal-review">显示答案</button>
        <div id="review-ratings" class="row" hidden>
          <button data-rating="again" class="quiet">重来</button><button data-rating="hard" class="quiet">困难</button>
          <button data-rating="good">记住了</button><button data-rating="easy" class="quiet">简单</button>
        </div>
      </div>
      <div id="saved-list" class="saved-list"><small>暂无收藏</small></div>
      <div class="row sync-controls">
        <button id="pick-sync" class="quiet">选择同步目录</button>
        <button id="sync-saved" class="quiet">立即同步</button>
        <small id="sync-directory">尚未设置同步目录</small>
      </div>
      <output id="saved-status"></output>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
