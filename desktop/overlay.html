<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ren'Py Translate Overlay</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="overlay">
  <main>
    <section class="overlay-panel">
      <header>
        <div><small id="speaker">当前文本</small></div>
        <small id="mode">拖动选择词语或句子</small>
        <button id="close" class="quiet" aria-label="关闭">×</button>
      </header>
      <p id="source" class="overlay-source">等待游戏文本…</p>
      <output id="result" class="overlay-result"></output>
      <div class="row">
        <button id="translate">翻译选中内容</button>
        <button id="save" class="quiet" disabled>收藏</button>
        <small class="overlay-help">双击选词 · 拖动选句 · Esc 返回游戏</small>
      </div>
    </section>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
